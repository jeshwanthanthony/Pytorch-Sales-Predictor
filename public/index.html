<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect Square</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0b0d10; color: #e7ecf2;
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  main { width: min(30rem, calc(100vw - 3rem)); text-align: center; }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 .4rem; letter-spacing: -.01em; }
  p.sub { margin: 0 0 2rem; color: #8d9aa8; font-size: .95rem; }
  button, a.btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .6rem;
    width: 100%; padding: .95rem 1.25rem; border: 0; border-radius: .7rem;
    background: #1f6feb; color: #fff; font: inherit; font-weight: 600;
    text-decoration: none; cursor: pointer; transition: background .15s ease;
  }
  a.btn:hover, button:hover { background: #2f7ff5; }
  button.ghost {
    background: transparent; border: 1px solid #253041; color: #9aa7b4;
    font-weight: 500; padding: .6rem 1rem; width: auto; margin-top: 1.5rem;
  }
  button.ghost:hover { background: #131820; }
  .meta { margin-top: 2rem; font-size: .8rem; color: #5f6d7c; }
  .meta code { color: #7f8d9c; }
  .card {
    margin-top: 1.5rem; padding: 1rem 1.25rem; text-align: left;
    background: #10151c; border: 1px solid #1c2532; border-radius: .7rem; font-size: .875rem;
  }
  .card .row { display: flex; justify-content: space-between; gap: 1rem; padding: .3rem 0; }
  .card .row span:first-child { color: #7f8d9c; }
  .card .row span:last-child { font-variant-numeric: tabular-nums; }
  .badge {
    display: inline-flex; align-items: center; gap: .45rem; padding: .3rem .7rem;
    border-radius: 999px; font-size: .8rem; font-weight: 600; margin-bottom: 1.25rem;
  }
  .badge.ok { background: rgba(46,160,67,.15); color: #56d364; }
  .badge.off { background: #161b22; color: #8d9aa8; }
  .dot { width: .5rem; height: .5rem; border-radius: 50%; background: currentColor; }
</style>
</head>
<body>
<main id="app"></main>

<script>
  const state = __STATE__;
  const app = document.getElementById('app');

  function row(label, value) {
    return `<div class="row"><span>${label}</span><span>${value}</span></div>`;
  }

  if (state.connected) {
    const locations = state.locations.length
      ? state.locations.map((l) => row(l.name || l.id, `<code>${l.id}</code>`)).join('')
      : row('Locations', 'none returned');

    app.innerHTML = `
      <div class="badge ok"><span class="dot"></span>Square connected</div>
      <h1>Ready to pull sales data</h1>
      <p class="sub">Access token stored in <code>.square-tokens.json</code>.</p>
      <div class="card">
        ${row('Environment', state.environment)}
        ${row('Merchant', `<code>${state.merchantId ?? '—'}</code>`)}
        ${state.expiresAt ? row('Token expires', new Date(state.expiresAt).toLocaleString()) : ''}
        ${locations}
      </div>
      <button class="ghost" id="disconnect">Disconnect</button>
    `;

    document.getElementById('disconnect').addEventListener('click', async () => {
      await fetch('/api/square/disconnect', { method: 'POST' });
      location.reload();
    });
  } else {
    app.innerHTML = `
      <div class="badge off"><span class="dot"></span>Not connected</div>
      <h1>Connect Square</h1>
      <p class="sub">Authorize read-only access to orders, payments, catalog, customers, inventory, and labor.</p>
      <a class="btn" href="/api/square/connect">Connect Square account</a>
      <div class="meta">
        ${state.environment} &middot; <code>${state.applicationId}</code>
      </div>
    `;
  }
</script>
</body>
</html>
