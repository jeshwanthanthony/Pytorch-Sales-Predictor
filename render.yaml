services:
  - type: web
    name: restaurant-forecast-ai
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SQUARE_APPLICATION_ID
        sync: false
      - key: SQUARE_APPLICATION_SECRET
        sync: false
      - key: SQUARE_ENVIRONMENT
        value: production
      - key: APP_SECRET
        generateValue: true
